[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# no cache: the package is bind-mounted, a run never writes into the tree
addopts = -v --tb=short --strict-markers --disable-warnings -p no:cacheprovider

testpaths = unit integration e2e

markers =
	unit: pure tests of the package over the real libcerver
	integration: a real cerver, created and compiled but never started
	e2e: started web servers and real HTTP requests
	fuzz: property tests with hypothesis
	slow: tests that take more than a few seconds
	legacy_server: the server of legacy/ that the tests of a class start
