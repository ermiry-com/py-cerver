name: PyCerver Tests

on:
  pull_request:
    branches:
      - '*'

env:
  CERVER_REPOSITORY: ermiry/cerver
  CERVER_REF: 2.0b-64

jobs:
  suite:
    name: PyCerver suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['', 'address,undefined']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Cerver
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CERVER_REPOSITORY }}
          ref: ${{ env.CERVER_REF }}
          path: .cerver

      - name: Move Cerver out of the workspace
        run: mv .cerver "${RUNNER_TEMP}/cerver"

      - name: Build
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          CERVER_DIR: ${{ runner.temp }}/cerver
        run: ./tests/build.sh

      - name: Every tier
        if: ${{ matrix.sanitizer == '' }}
        run: ./tests/run.sh

      - name: Every tier with sanitizers
        if: ${{ matrix.sanitizer != '' }}
        run: ./tests/run.sh asan

  test:
    name: PyCerver tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libcurl4-openssl-dev

      - name: Build Docker Image
        run: docker build -t ermiry/pycerver:local -f Dockerfile.local .

      - name: Compile Cerver
        env:
          CERVER_VERSION: 2.0b-64
        run: |
          mkdir /opt/cerver && cd /opt/cerver
          wget -q --no-check-certificate https://github.com/ermiry/cerver/archive/$CERVER_VERSION.zip
          unzip $CERVER_VERSION.zip
          cd cerver-$CERVER_VERSION
          make clean
          make TYPE=test -j4
          sudo make TYPE=test install
          sudo ldconfig

      - name: Compile Tests
        run: |
          make clean
          make TYPE=test test

      - name: Ping Integration Test
        run: |
          docker run -d --name test --rm -p 7000:7000 ermiry/pycerver:local python3 ping.py
          sleep 2
          sudo docker inspect test --format='{{.State.ExitCode}}'
          ./tests/clients/bin/client/ping
          sudo docker kill $(sudo docker ps -q)

      - name: Web Integration Test
        run: |
          sudo docker run -d --name test --rm -p 8080:8080 ermiry/pycerver:local python3 web/web.py
          sleep 2
          sudo docker inspect test --format='{{.State.ExitCode}}'
          ./tests/clients/bin/client/web/web
          sudo docker kill $(sudo docker ps -q)

      - name: JSON Integration Test
        run: |
          sudo docker run -d --name test --rm -p 8080:8080 ermiry/pycerver:local python3 web/responses.py
          sleep 2
          sudo docker inspect test --format='{{.State.ExitCode}}'
          ./tests/clients/bin/client/web/json
