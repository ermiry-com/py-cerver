services:
  api:
    restart: always
    image: ermiry/pycerver:examples
    command: python3 examples/service/main.py
    environment:
      - PORT=5000
      - TRUSTED_PROXY=172.16.0.0/12
    ports:
      - 5000
    stop_grace_period: 32s

  nginx:
    restart: always
    image: ermiry/pycerver-nginx:latest
    ports:
      - '80:80'
    depends_on:
      - api

networks:
  default:
    name: cerver
    external: true
